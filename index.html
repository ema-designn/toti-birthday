<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>happy birthday toti</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Quicksand:wght@500;600&family=Cairo:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f050b; --bg2:#1a0c14;
  --pink:#ff8fb8; --pink-soft:#ffc2d9; --rose:#e0457b;
  --cream:#fff3f7; --flame:#ffd36e;
  --glass:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif;
  color:var(--cream);
  background:radial-gradient(ellipse at 50% 20%,#2a0f1f 0%,var(--bg2) 45%,var(--bg1) 100%);
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
#fx,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#confetti{z-index:30}
main{
  position:relative;z-index:5;height:100%;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:24px 22px 36px;max-width:480px;margin:0 auto;
  transition:opacity .5s,visibility .5s;
}
main>:first-child{margin-top:auto}
main>:last-child{margin-bottom:auto}
main.away{opacity:0;visibility:hidden}

/* Cake */
.cake{position:relative;width:210px;height:230px;margin-bottom:26px;filter:drop-shadow(0 18px 30px rgba(224,69,123,.35))}
.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:230px;height:14px;border-radius:50%;background:linear-gradient(#f7d9e4,#c98fa7)}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.t1{bottom:10px;width:200px;height:68px;background:linear-gradient(#ff9bbd,#e0457b)}
.t2{bottom:78px;width:150px;height:58px;background:linear-gradient(#fff3f7,#f5c6d7)}
.t3{bottom:136px;width:100px;height:46px;background:linear-gradient(#ff9bbd,#e0457b)}
.drip{position:absolute;left:0;right:0;top:-1px;height:16px;background:
  radial-gradient(circle at 12px 0,#fff3f7 11px,transparent 12px) 0 0/28px 16px repeat-x;border-radius:14px 14px 0 0}
.t1 .drip,.t3 .drip{opacity:.95}
.t2 .drip{background:radial-gradient(circle at 12px 0,#ffb6cf 11px,transparent 12px) 0 0/28px 16px repeat-x}
.dots{position:absolute;inset:auto 0 12px 0;display:flex;justify-content:space-around;padding:0 16px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.75)}
.candle{position:absolute;bottom:182px;left:50%;width:10px;height:38px;transform:translateX(-50%);border-radius:3px;
  background:repeating-linear-gradient(135deg,#fff 0 6px,var(--pink) 6px 12px)}
.flame{position:absolute;bottom:216px;left:50%;width:18px;height:30px;margin-left:-9px;
  background:radial-gradient(ellipse at 50% 75%,#fff 0%,var(--flame) 35%,#ff9a3c 70%,transparent 72%);
  border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;
  animation:flicker 1.1s ease-in-out infinite alternate;
  box-shadow:0 0 28px 10px rgba(255,190,90,.55);transition:opacity .5s,transform .5s}
.glow{position:absolute;bottom:200px;left:50%;width:150px;height:150px;margin-left:-75px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,120,.35),transparent 65%);transition:opacity .6s}
.smoke{position:absolute;bottom:222px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:rgba(255,255,255,.5);opacity:0}
.out .flame,.out .glow{opacity:0;transform:scale(.2)}
.out .smoke{animation:smoke 1.6s ease-out}
@keyframes flicker{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.08) rotate(2deg)}}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(8)}}

/* Text */
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,8vw,38px);line-height:1.2;margin-bottom:12px;
  text-shadow:0 0 24px rgba(255,143,184,.45)}
p.sub{font-size:clamp(15px,4.2vw,17px);line-height:1.6;color:var(--pink-soft);max-width:340px;margin:0 auto 30px}
.swap{transition:opacity .35s ease,transform .35s ease}
.swap.hide{opacity:0;transform:translateY(8px)}

/* Button */
.btn{
  font:600 17px 'Quicksand',sans-serif;color:#3a0a1e;border:0;cursor:pointer;
  padding:16px 38px;border-radius:999px;
  background:linear-gradient(135deg,#ffc2d9,var(--pink));
  box-shadow:0 0 0 0 rgba(255,143,184,.6),0 10px 30px rgba(255,143,184,.45);
  animation:pulse 2.4s infinite;transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 40px rgba(255,143,184,.7)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.nav button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(255,143,184,0),0 10px 30px rgba(255,143,184,.45)}100%{box-shadow:0 0 0 0 rgba(255,143,184,0),0 10px 30px rgba(255,143,184,.45)}}

/* Big gift button */
.gift{margin-top:22px;width:min(100%,300px);display:flex;align-items:center;justify-content:center;gap:14px;
  padding:18px 22px;border-radius:30px;cursor:pointer;color:var(--cream);font:600 18px 'Quicksand',sans-serif;
  background:linear-gradient(135deg,rgba(255,143,184,.28),rgba(224,69,123,.2));
  border:1.5px solid rgba(255,194,217,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 36px rgba(224,69,123,.35),inset 0 0 20px rgba(255,255,255,.06);transition:transform .2s,box-shadow .2s}
.gift:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 18px 46px rgba(255,143,184,.55)}
.gift .ic{font-size:44px;line-height:1;animation:wiggle 2.8s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}

/* Screens */
.screen{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;
  opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .5s,transform .5s,visibility .5s}
.screen.active{opacity:1;visibility:visible;transform:none}
.box{width:min(100%,420px);min-height:280px;padding:34px 28px;border-radius:28px;text-align:center;
  background:var(--glass);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(255,143,184,.15)}
.box h2{font-family:'Playfair Display',serif;font-size:clamp(22px,6.4vw,28px);font-weight:600;letter-spacing:.04em;color:var(--pink);margin-bottom:16px;min-height:1.3em}
.box p{font-size:clamp(16px,4.4vw,18px);line-height:1.75;min-height:9em}
.typing::after{content:'';display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--pink);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pill{font:600 16px 'Quicksand',sans-serif;padding:13px 28px;border-radius:999px;cursor:pointer;color:var(--cream);transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-2px)}
.pill:focus-visible,.gift:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pill.primary{border:0;color:#3a0a1e;background:linear-gradient(135deg,#ffc2d9,var(--pink));box-shadow:0 8px 26px rgba(255,143,184,.45)}
.pill.ghost{background:var(--glass);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill.small{padding:8px 16px;font-size:14px}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.reveal{opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s,transform .6s}
.reveal.show{opacity:1;transform:none;pointer-events:auto}
.row{display:flex;gap:14px}

/* Photo pages */
.polaroid{width:min(100%,360px);padding:14px 14px 18px;background:var(--cream);border-radius:10px 10px 18px 18px;
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 50px rgba(255,143,184,.25);transform:rotate(-1.5deg);transition:opacity .25s,transform .25s}
.polaroid.hide{opacity:0;transform:rotate(1.5deg) translateY(10px)}
.photo{position:relative;width:100%;aspect-ratio:4/5;max-height:50vh;background:#2a0f1f;border-radius:4px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.2s ease}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--pink-soft);font-size:14px;
  background:repeating-linear-gradient(45deg,#2a0f1f 0 12px,#33142a 12px 24px)}
.ph[hidden]{display:none}
.polaroid figcaption{font-family:'Cairo','Quicksand',sans-serif;font-weight:600;color:#5a1a35;white-space:pre-line;
  font-size:clamp(16px,4.4vw,18px);line-height:1.9;text-align:center;margin-top:14px;min-height:2.9em}
.polaroid.long .photo{max-height:32vh}
.polaroid.long figcaption{font-size:15px;line-height:1.85}
#gallery{justify-content:flex-start}
#gallery .pill.ghost{backdrop-filter:none;-webkit-backdrop-filter:none}
.photo img{transform:translateZ(0)}
#gallery>:first-child{margin-top:auto}
#gallery>:last-child{margin-bottom:auto}
.pager{display:flex;gap:8px}
.pager i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.pager i.on{background:var(--pink);box-shadow:0 0 10px var(--pink);transform:scale(1.3)}

@media (prefers-reduced-motion:reduce){
  .flame,.btn{animation:none}
}
@media (max-height:640px){.cake{transform:scale(.8);margin-bottom:0}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<canvas id="confetti"></canvas>

<main id="home">
  <div class="cake" id="cake" aria-hidden="true">
    <div class="glow"></div>
    <div class="flame"></div>
    <div class="smoke"></div>
    <div class="candle"></div>
    <div class="tier t3"><div class="drip"></div></div>
    <div class="tier t2"><div class="drip"></div><div class="dots"><i></i><i></i><i></i><i></i></div></div>
    <div class="tier t1"><div class="drip"></div><div class="dots"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="plate"></div>
  </div>

  <h1 id="title" class="swap">happy birthday toti</h1>
  <p id="sub" class="sub swap">Take a deep breath, make a heartfelt wish, and blow out the candle!</p>
  <button id="btn" class="btn">Blow the Candle ✨</button>
  <button id="giftBtn" class="gift"><span class="ic">🎁</span><span>Open your surprise</span></button>
</main>

<section class="screen" id="message" aria-label="Message">
  <button class="pill ghost small corner" id="msgHome">‹ Home</button>
  <div class="box">
    <h2 id="mHead"></h2>
    <p id="mBody"></p>
  </div>
  <button class="pill primary reveal" id="toPhotos">See our memories 📸</button>
</section>

<section class="screen" id="gallery" aria-label="Photos">
  <figure class="polaroid" id="fig">
    <div class="photo"><img id="pImg" alt="" decoding="async"><div class="ph" id="pPh" hidden></div></div>
    <figcaption id="pCap" dir="auto"></figcaption>
  </figure>
  <div class="pager" id="pager"></div>
  <div class="row">
    <button class="pill ghost" id="prev">‹ Back</button>
    <button class="pill primary" id="next">Next ›</button>
  </div>
</section>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---------- Floating hearts & sparkles ---------- */
  const fx = $('#fx'), fctx = fx.getContext('2d');
  let W, H, dpr = Math.min(devicePixelRatio || 1, 2), parts = [];
  function resize(){
    W = innerWidth; H = innerHeight;
    [fx, $('#confetti')].forEach(c => { c.width = W*dpr; c.height = H*dpr; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); });
  }
  addEventListener('resize', resize); resize();

  const spawn = (init) => ({
    x: Math.random()*W, y: init ? Math.random()*H : H + 20,
    s: 6 + Math.random()*16, v: .25 + Math.random()*.7,
    sway: Math.random()*Math.PI*2, a: .25 + Math.random()*.6,
    heart: Math.random() < .55, hue: Math.random() < .6 ? '255,143,184' : '255,255,255'
  });
  const N = reduce ? 14 : Math.min(40, Math.floor(W/14));
  for(let i=0;i<N;i++) parts.push(spawn(true));

  function heart(c, x, y, s){
    c.beginPath();
    c.moveTo(x, y + s*.3);
    c.bezierCurveTo(x, y - s*.2, x - s*.6, y - s*.2, x - s*.6, y + s*.15);
    c.bezierCurveTo(x - s*.6, y + s*.5, x, y + s*.75, x, y + s);
    c.bezierCurveTo(x, y + s*.75, x + s*.6, y + s*.5, x + s*.6, y + s*.15);
    c.bezierCurveTo(x + s*.6, y - s*.2, x, y - s*.2, x, y + s*.3);
    c.fill();
  }
  function sparkle(c, x, y, s){
    c.beginPath();
    c.moveTo(x, y - s); c.quadraticCurveTo(x, y, x + s, y);
    c.quadraticCurveTo(x, y, x, y + s); c.quadraticCurveTo(x, y, x - s, y);
    c.quadraticCurveTo(x, y, x, y - s); c.fill();
  }
  let paused = false;
  function loop(t){
    if(paused){ requestAnimationFrame(loop); return; }
    fctx.clearRect(0,0,W,H);
    parts.forEach((p,i) => {
      p.y -= p.v; p.sway += .015;
      const x = p.x + Math.sin(p.sway)*14;
      const fade = Math.min(1, p.y/(H*.3));
      fctx.fillStyle = `rgba(${p.hue},${p.a*Math.max(fade,0)})`;
      fctx.shadowColor = `rgba(${p.hue},.8)`; fctx.shadowBlur = 12;
      p.heart ? heart(fctx, x, p.y, p.s) : sparkle(fctx, x, p.y, p.s*.5);
      if(p.y < -30) parts[i] = spawn(false);
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- Confetti ---------- */
  const cc = $('#confetti'), cctx = cc.getContext('2d');
  let bits = [], running = false;
  const colors = ['#ff8fb8','#ffc2d9','#ffffff','#ffd36e','#e0457b','#ff5c9a','#f7a8ff'];
  function burst(){
    if(reduce) return;
    const ox = W/2, oy = H*.38;
    for(let i=0;i<170;i++){
      const ang = Math.random()*Math.PI*2, sp = 5 + Math.random()*11;
      bits.push({x:ox,y:oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-5,
        w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:colors[i%colors.length],life:1,round:Math.random()<.3});
    }
    if(!running){ running = true; requestAnimationFrame(tick); }
  }
  function tick(){
    cctx.clearRect(0,0,W,H);
    bits = bits.filter(b => b.life > 0 && b.y < H + 30);
    bits.forEach(b => {
      b.vy += .28; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .004;
      cctx.save(); cctx.translate(b.x,b.y); cctx.rotate(b.r);
      cctx.globalAlpha = Math.max(b.life,0); cctx.fillStyle = b.c;
      b.round ? (cctx.beginPath(), cctx.arc(0,0,b.w/2,0,7), cctx.fill()) : cctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      cctx.restore();
    });
    bits.length ? requestAnimationFrame(tick) : (running = false, cctx.clearRect(0,0,W,H));
  }

  /* ---------- State toggle ---------- */
  const states = {
    lit:{ t:'happy birthday toti', s:'Take a deep breath, make a heartfelt wish, and blow out the candle!', b:'Blow the Candle ✨' },
    out:{ t:'Happy Birthday, habiby! 🎂', s:'May all your wishes and dreams come true this year! ✨', b:'Light it Again ✨' }
  };
  let isOut = false;
  const title = $('#title'), sub = $('#sub'), btn = $('#btn'), cake = $('#cake');

  btn.addEventListener('click', () => {
    isOut = !isOut;
    const st = isOut ? states.out : states.lit;
    cake.classList.toggle('out', isOut);
    if(isOut) burst();
    [title, sub].forEach(el => el.classList.add('hide'));
    setTimeout(() => {
      title.textContent = st.t; sub.textContent = st.s; btn.textContent = st.b;
      [title, sub].forEach(el => el.classList.remove('hide'));
    }, 300);
  });

  /* ---------- Screens ---------- */
  const CAPTIONS = [
`كل سنه وانت معايا وجمبي وهتفضل اغلي واحن واطيب واحد فالدنيا كلها ربنا يديمك ف حياتي يتوتي ونفضل نحتفل كل سنه سوا بتمنالك كل الخير والسعاده اللي فالدنيا يحبيبي❤️🫂`,
`مش بس حبيبي والله انت كل حاجه حلوه ف حياتي ومهما حصل اي هفضل بحبك بردو وجودك معايا بجد بيفرق ف كل حاجه لو فيه اي زعل بحس كل حاجه بقت باهته وملهاش طعم ربنا ميحرمنيش من وجودك ولا من حسك حتي لو متخانقين وزعلانين 🙂❤️`,
`كل سنه وانت اجمل حاجه ف حياتي واقرب حد لقلبي كل سنه وانت بخير واشوفك دايما بخير وربنا ميحرمنيش منك ولا من وجودك وبحبك اوي يتوتي وربنا يخليك ليا❤️❤️❤️`,
`لو ليا امنيه واحده اطلبها مالدنيا هتكون انك تفضل معايا العمر كلو وان اشوفك دايما فرحان ومحقق كل حاجه بتتمناها❤️

يمكن مش هعرف اقولك كل اللي فقلبي بس والله مكانتك فقلبي كبيره مهما حصل وبحبك اوي وانت غالي عندي اوي اوي اكتر بكتير من اي كلام اقدر اقولو❤️

انا اسفه من قلبي اني ضايقتك واني خليتك تزعل او تشيل ف قلبك بسببي بس والله م كان قصدي ازعلك مش عايزاك تفتكر ف يوم زعلك مش فارق معايا بالعكس انا ببقي عاوزه اشوفك فرحان ومرتاح دايما❤️

المهم كل سنه وانت معايا وربنا يديمك ويحفظك من كل حاجه وحشه ويحققللك كل اللي بتتمناه بحبك اوي ومهما عدا وحصل عمر م حبي ليك دا هيقل وسامحني علي زعلك ويارب اشوفك دايما مبسوط وبخير وسنينك الجايه كلها هنا يارب❤️`,
`الصوره اللي انا بحبها اويييي😹😹❤️
كل سنه وانا لازقه فيك وبحبك وبموت فيك❤️❤️❤️🫂`
  ];
  const EXTS = ['jpg','jpeg','png','webp','JPG','JPEG','PNG','WEBP'];
  const HEAD = 'HAPPY BIRTHDAY MY LOVE';
  const BODY = 'Thank you for filling my days with happiness, my heart with warmth, and my life with countless beautiful memories. I love you more than words can say❤️❤️❤️🫂';

  const home = $('#home');
  function go(id){
    paused = id === 'gallery';
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    home.classList.toggle('away', id !== 'home');
  }

  /* ---------- Typing message ---------- */
  const seg = t => (window.Intl && Intl.Segmenter)
    ? Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(t), x => x.segment)
    : Array.from(t);
  const mHead = $('#mHead'), mBody = $('#mBody'), toPhotos = $('#toPhotos');
  let typeTimer;
  function typeMessage(){
    clearTimeout(typeTimer);
    mHead.textContent = ''; mBody.textContent = ''; toPhotos.classList.remove('show');
    const hs = seg(HEAD), bs = seg(BODY); let i = 0, j = 0;
    if(reduce){ mHead.textContent = HEAD; mBody.textContent = BODY; toPhotos.classList.add('show'); return; }
    mHead.classList.add('typing');
    (function step(){
      if(i < hs.length){ mHead.textContent += hs[i++]; typeTimer = setTimeout(step, 80); return; }
      mHead.classList.remove('typing'); mBody.classList.add('typing');
      if(j < bs.length){
        const ch = bs[j++]; mBody.textContent += ch;
        typeTimer = setTimeout(step, /[.,]/.test(ch) ? 260 : 42); return;
      }
      mBody.classList.remove('typing'); toPhotos.classList.add('show');
    })();
  }
  $('#giftBtn').addEventListener('click', () => { go('message'); setTimeout(typeMessage, 450); });
  $('#msgHome').addEventListener('click', () => { clearTimeout(typeTimer); go('home'); });
  toPhotos.addEventListener('click', () => { go('gallery'); showSlide(0, true); });

  /* ---------- Photo pages (Fix for mobile overlay issue) ---------- */
  const fig = $('#fig'), img = $('#pImg'), ph = $('#pPh'), cap = $('#pCap'), pager = $('#pager');
  const prev = $('#prev'), next = $('#next'); let cur = 0;
  CAPTIONS.forEach(() => pager.appendChild(document.createElement('i')));

  const urlCache = {};
  
  function findImage(n) {
    if (n < 1 || n > CAPTIONS.length) return Promise.resolve(null);
    if (urlCache[n]) return urlCache[n];

    urlCache[n] = new Promise(resolve => {
      let idx = 0;
      function checkNext() {
        if (idx >= EXTS.length) return resolve(null);
        const testImg = new Image();
        const src = `photo${n}.${EXTS[idx]}`;
        testImg.onload = () => resolve(src);
        testImg.onerror = () => { idx++; checkNext(); };
        testImg.src = src;
      }
      checkNext();
    });

    return urlCache[n];
  }

  let tok = 0, tm;
  function showSlide(i, instant){
    cur = i; 
    const my = ++tok; 
    clearTimeout(tm);
    
    fig.classList.add('hide');
    
    // Clear image immediately to avoid previous image ghosting on mobile
    img.removeAttribute('src');
    img.style.opacity = '0';

    tm = setTimeout(async () => {
      const url = await findImage(i + 1);
      if(my !== tok) return;

      if(url){
        img.src = url;
        try { await img.decode(); } catch(e) {}
        if(my !== tok) return;
        img.hidden = false; 
        ph.hidden = true;
        img.style.opacity = '1';
      } else {
        img.hidden = true; 
        ph.hidden = false;
        ph.textContent = `Save your picture as photo${i + 1}.jpg in the same folder as this file`;
      }

      cap.textContent = CAPTIONS[i];
      fig.classList.toggle('long', CAPTIONS[i].length > 220);
      $('#gallery').scrollTop = 0;
      [...pager.children].forEach((d, n) => d.classList.toggle('on', n === i));
      next.textContent = i === CAPTIONS.length - 1 ? 'Finish ❤️' : 'Next ›';
      requestAnimationFrame(() => fig.classList.remove('hide'));
      
      // Preload adjacent images
      findImage(i + 2); 
      findImage(i);                  
    }, instant ? 0 : 220);
  }

  prev.addEventListener('click', () => {
    if(cur === 0){ go('message'); mHead.textContent = HEAD; mBody.textContent = BODY; toPhotos.classList.add('show'); clearTimeout(typeTimer); mHead.classList.remove('typing'); mBody.classList.remove('typing'); }
    else showSlide(cur - 1);
  });
  next.addEventListener('click', () => {
    if(cur === CAPTIONS.length - 1) go('home'); else showSlide(cur + 1);
  });
})();
</script>
</body>
</html>
